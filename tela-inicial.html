<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canto do Saber - Com Busca</title>
    <style>
        /* --- ESTILOS GERAIS (Baseados na sua imagem) --- */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 400px; /* Largura de celular */
            background-color: #0a0a0a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #222;
            border-right: 1px solid #222;
            position: relative;
            padding-bottom: 80px; /* Espaço para o menu inferior */
        }

        /* --- CABEÇALHO --- */
        header {
            text-align: center;
            padding: 20px 15px 10px 15px;
            background-color: #0a0a0a;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            margin: 0 0 5px 0;
            font-weight: bold;
        }

        header p {
            font-size: 0.9rem;
            color: #aaa;
            margin: 0 0 15px 0;
        }

        /* --- BARRA DE PESQUISA (O FOCO do pedido) --- */
        .search-container {
            position: relative;
            width: 100%;
        }

        .search-container input {
            width: 100%;
            padding: 12px 15px 12px 40px; /* Padding esquerdo para o ícone */
            border-radius: 20px;
            border: 1px solid #333;
            background-color: #1c1c1c;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .search-container input:focus {
            border-color: #555;
        }

        .search-container input::placeholder {
            color: #777;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            font-size: 1rem;
            pointer-events: none; /* Permite clicar através do ícone */
        }

        /* --- LISTA DE POSTS (Seus cartões) --- */
        .feed {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .post-card {
            background-color: #1c1c1c;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #2a2a2a;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #aaa;
            font-size: 0.85rem;
        }

        .post-avatar {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .post-title {
            font-weight: bold;
            font-size: 1rem;
            margin: 0;
        }

        .post-text {
            font-size: 0.9rem;
            margin: 0;
            color: #ccc;
        }

        .post-actions {
            display: flex;
            gap: 15px;
            font-size: 0.75rem;
            color: #777;
            margin-top: 5px;
        }

        /* --- ESTILO PARA QUANDO NÃO ENCONTRAR NADA --- */
        .no-results {
            text-align: center;
            color: #777;
            margin-top: 30px;
            display: none; /* Escondido por padrão */
        }

        /* --- MENU INFERIOR (Apenas visual da imagem) --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 400px;
            background-color: #1c1c1c;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            z-index: 20;
        }

        .nav-item {
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .add-btn {
            background-color: #8b0000; /* Vermelho escuro */
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-top: -20px; /* Sobe o botão */
        }
    </style>
</head>
<body>

<div class="app-container">

        <div class="search-container">
            <span class="search-icon"></span>
            <input type="text" id="searchInput" placeholder="Pesquisar no Canto do Saber...">
        </div>
    </header>

    <div class="feed" id="feed">
  
        <div class="post-card" data-search="gla oi cristo a os">
            <div class="post-header">
                <div class="post-avatar">👤</div>
                <span>gla</span>
                <span>oi</span>
            </div>
            <p class="post-title">cristo</p>
            <p class="post-text">a</p>
            <div class="post-actions">
                <span>os</span>
                <span>Compartilhar</span>
                <span>Salvar</span>
            </div>
        </div>

        <!-- Post 2 -->
        <div class="post-card" data-search="64738920 0 4936750928650298650984659386 nao like compartilhar salvar9yeb9yw">
            <div class="post-header">
                <div class="post-avatar">👤</div>
                <span>64738920</span>
                <span>0</span>
            </div>
            <p class="post-title">4936750928650298650984659386</p>
            <p class="post-text">nao</p>
            <div class="post-actions">
                <span>like</span>
                <span>compartilhar</span>
                <span>salvar9yeb9yw</span>
            </div>
        </div>

        <div class="post-card" data-search="maria exemplo teste busca funcional">
            <div class="post-header">
                <div class="post-avatar">👤</div>
                <span>maria</span>
                <span>há 2 min</span>
            </div>
            <p class="post-title">Exemplo de Post</p>
            <p class="post-text">Teste a busca funcional digitando "maria" ou "exemplo".</p>
            <div class="post-actions">
                <span>curtir</span>
                <span>compartilhar</span>
            </div>
        </div>

    </div>

    <div class="no-results" id="noResults">
        Nenhum resultado encontrado.
    </div>

    <!-- MENU INFERIOR -->
    <div class="bottom-nav">
        <div class="nav-item">📅</div>
        <div class="nav-item">👥</div>
        <div class="add-btn">+</div>
        <div class="nav-item">🎧</div>
        <div class="nav-item">🔒</div>
    </div>

</div>

<script>
    // 1. Seleciona os elementos do HTML
    const searchInput = document.getElementById('searchInput');
    const feed = document.getElementById('feed');
    const posts = feed.querySelectorAll('.post-card');
    const noResults = document.getElementById('noResults');

    // 2. Adiciona o "ouvinte" de evento para quando o usuário digitar
    searchInput.addEventListener('input', function(event) {
        // Pega o texto digitado e transforma em minúsculo para facilitar a busca
        const searchTerm = event.target.value.toLowerCase().trim();
        let foundAny = false;

        // 3. Percorre todos os posts
        posts.forEach(post => {
            // Pega o atributo "data-search" que criamos no HTML (que contém todo o texto do post)
            // ou pega o texto visível do post
            const searchableText = post.getAttribute('data-search') || post.textContent.toLowerCase();

            // 4. Verifica se o texto digitado está dentro do texto do post
            if (searchableText.toLowerCase().includes(searchTerm)) {
                post.style.display = 'flex'; // Mostra o post
                foundAny = true;
            } else {
                post.style.display = 'none'; // Esconde o post
            }
        });

        // 5. Mostra ou esconde a mensagem de "Nenhum resultado"
        if (foundAny || searchTerm === '') {
            noResults.style.display = 'none';
        } else {
            noResults.style.display = 'block';
        }
    });
</script>

</body>
</html>
